name: Alpha123 airdrop monitor
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: Send a test push notification
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: alpha123-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check today airdrops
        env:
          GH_STATE_TOKEN: ${{ github.token }}
          NOTIFY_CHANNEL: ${{ vars.NOTIFY_CHANNEL || 'bark' }}
          BARK_URL: ${{ secrets.BARK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: |
          if [ "$TEST_NOTIFICATION" = "true" ]; then
            python monitor.py --test-notification
          else
            python monitor.py
          fi
